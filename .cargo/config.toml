[target.riscv32imc-unknown-none-elf]
# The partition table carries two OTA slots; otadata is erased on every
# USB flash so the chip boots ota_0, where espflash put the image, even
# after an OTA had switched it to ota_1.
runner = "espflash flash --monitor --chip esp32c3 --partition-table partitions.csv --erase-parts otadata"

[env]
ESP_LOG="info"

[alias]
# The host-testable half; `build.target` above would otherwise aim the tests at the chip.
host-test = "test -p esp32clock-core --target host-tuple"

[build]
rustflags = [
  # Required to obtain backtraces (e.g. when using the "esp-backtrace" crate.)
  # NOTE: May negatively impact performance of produced code
  "-C", "force-frame-pointers",
]

target = "riscv32imc-unknown-none-elf"

[unstable]
build-std = ["core"]
