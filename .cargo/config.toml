[target.riscv32imc-unknown-none-elf]
# The partition table carries two OTA slots; otadata is erased on every
# USB flash so the chip boots ota_0, where espflash put the image, even
# after an OTA had switched it to ota_1.
runner = "espflash flash --monitor --chip esp32c3 --partition-table partitions.csv --erase-parts otadata"

[env]
ESP_LOG="info"
# The Wi-Fi driver's MTU, which smoltcp turns into the largest frame the
# clock sends (TCP segments of MTU - 54 bytes of payload). Small so a
# marginal uplink, which passes short frames long after full ones fail,
# keeps passing them; received frames are not bounded by it. The probe's
# size follows it in `core/src/config.rs`.
ESP_RADIO_CONFIG_WIFI_MTU="540"

[alias]
# The host-testable half; `build.target` above would otherwise aim the tests at the chip.
host-test = "test -p onebitdawn-core --target host-tuple"
# The pack maker (`tools/pack`): the command on the host, its tests, and
# the library as WebAssembly for the page in `docs/pack/`.
pack      = "run -q --release -p onebitdawn-pack --target host-tuple --"
pack-test = "test -p onebitdawn-pack --target host-tuple"
pack-wasm = "build --profile tool -p onebitdawn-pack --lib --target wasm32-unknown-unknown"

[build]
rustflags = [
  # Required to obtain backtraces (e.g. when using the "esp-backtrace" crate.)
  # NOTE: May negatively impact performance of produced code
  "-C", "force-frame-pointers",
]

target = "riscv32imc-unknown-none-elf"

[unstable]
build-std = ["core"]
