[package]
edition      = "2024"
name         = "onebitdawn-pack"
rust-version = "1.95"
license      = "MIT OR Apache-2.0"
version      = "0.1.0"
publish      = false
description  = "Makes a clip pack for a onebitdawn clock out of tracker modules, SID and PT3 tunes and sound files."

# The library is the converters and the pack writer; the binary is the
# command, and the `cdylib` is the same library for the web page
# (`cargo pack-wasm`, see `src/wasm.rs`).
[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "onebitdawn-pack"
path = "src/main.rs"

[dependencies]
# The pack's layout and its parser, the clips' magics and the players,
# which are what a pack is checked with before it is given out.
onebitdawn-core = { path = "../../core" }
sha2 = { version = "0.10", default-features = false }

# `core` leaves the critical section and the time driver to whoever
# links it: esp-hal in the firmware. The command needs them given, or
# the `cdylib`, which cargo builds beside it, does not link where a
# library may leave no symbol undefined (MSVC: v0.5-rc1's release).
# The WebAssembly has no use for either and imports nothing.
# `generic-queue-8` is embassy-time's own timer queue: without it the
# queue asks for an executor's, and there is none here.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
embassy-time     = { version = "0.5.0", features = ["std", "generic-queue-8"] }
critical-section = { version = "1.2.0", features = ["std"] }
