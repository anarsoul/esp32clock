[package]
edition      = "2024"
name         = "esp32clock"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "esp32clock"
path = "./src/bin/main.rs"

# The firmware is the root package, so plain cargo commands build only
# it; `core` is the host-testable half (`cargo host-test`).
[workspace]
members = ["core"]

[dependencies]
esp32clock-core = { path = "core" }

esp-hal = { version = "1.2.2", features = ["esp32c3", "log-04", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c3",
  "log-04",
] }
esp-radio = { version = "1.0.0-beta.1", features = [
  "esp-alloc",
  "esp32c3",
  "log-04",
  "unstable",
  "wifi",
] }
esp-alloc = { version = "0.11.0", features = ["esp32c3"] }
embassy-net = { version = "0.9.1", features = [
  "auto-icmp-echo-reply",
  "dhcpv4",
  "dhcpv4-hostname",
  "dns",
  "icmp",
  "log",
  "medium-ethernet",
  "proto-ipv4",
  "tcp",
  "udp",
] }
embedded-io-async = "0.7.0"
heapless          = "0.9"
sntpc              = { version = "0.11.0", default-features = false }
sntpc-net-embassy  = "0.11.0"
sntpc-time-embassy = "0.6.0"

esp-bootloader-esp-idf = { version = "0.6.0", features = ["embedded-storage", "esp32c3", "log-04"] }
log                    = "0.4.27"

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
embassy-sync = "0.7"
esp-backtrace = { version = "0.20.0", features = [
  "custom-halt",
  "esp32c3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.18.0", features = ["esp32c3", "log-04", "timestamp"] }

critical-section = "1.2.0"
# SHA-256 of an uploaded image, checked against the hash espflash appends.
sha2             = { version = "0.10", default-features = false }
# Atomics for the RTC-RAM carry record: esp-hal accepts them in a persistent static.
portable-atomic  = "1.15"
static_cell      = "2.1.1"
embassy-futures = "0.1.2"

# Settings in flash: the nvs partition, a sequential-storage map over esp-storage.
esp-storage            = { version = "0.10.0", features = ["esp32c3", "embedded-storage", "bytewise-read"] }
sequential-storage     = "8.0.2"
embedded-storage       = "0.3.1"
embedded-storage-async = "0.4.1"


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
