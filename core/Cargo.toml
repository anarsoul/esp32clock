[package]
edition      = "2024"
name         = "esp32clock-core"
rust-version = "1.95"
license      = "MIT OR Apache-2.0"
version      = "0.1.0"
publish      = false
description  = "The hardware-independent half of esp32clock: settings, form, UI, panel map, codecs. Tested on the host."

[lib]
path = "src/lib.rs"

[dependencies]
embassy-sync     = "0.7"
embassy-time     = "0.5.0"
critical-section = "1.2.0"
log              = "0.4.27"
heapless         = "0.9"
# SHA-256 of an uploaded image, checked against the hash espflash appends.
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
# The host needs a time driver and a critical section; the firmware gets both from esp-hal.
embassy-time     = { version = "0.5.0", features = ["std"] }
critical-section = { version = "1.2.0", features = ["std"] }
