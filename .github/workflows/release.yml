# A release from a `v*` tag: the firmware with the prebuilt settings
# (the same as ci.yml), the OTA image for `/update`, the merged image
# for espflash, the default clip pack and the pack maker (tools/pack)
# as a command for Linux, Windows and macOS, attached to the GitHub release; then the flasher
# page in docs/ and the pack maker's page in docs/pack/ with its
# WebAssembly, with the release's manifest and images, deployed to the
# gh-pages branch, keeping earlier releases, which the page offers in a
# list. The firmware version comes from `git describe`, which sees
# annotated tags only, so a release tag is made with `git tag -a`.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # What the prebuilt image is configured with; see ci.yml and MANUAL.md.
  WIFI_SSID: ""
  WIFI_PASSWORD: ""
  TZ_RULE: "<-07>7" # Vancouver, UTC-7 all year
  API_TOKEN: "" # none: the PIN on the panel until the owner sets one
  ESPFLASH_VERSION: v4.7.0

jobs:
  build:
    name: Firmware and images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # build.rs puts `git describe` into the firmware version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imc-unknown-none-elf, wasm32-unknown-unknown
          components: rust-src, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install espflash
        run: |
          curl -sSfL -o espflash.zip \
            "https://github.com/esp-rs/espflash/releases/download/${ESPFLASH_VERSION}/espflash-x86_64-unknown-linux-gnu.zip"
          mkdir -p "$HOME/.local/bin"
          unzip -q espflash.zip espflash -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/espflash"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/espflash" --version
      # A tag never publishes a build the CI would have failed.
      - name: Test the core crate on the host
        run: cargo host-test
      - name: Test the pack maker
        run: cargo pack-test
      - name: Test with the clips built in
        run: ALARM_CLIP=clips/trantor.bpr,clips/halftime.xmc,clips/keygen.xmc,clips/synchronization.pt3c,clips/morning_mood.xmc,clips/morning_mood_chip.xmc,clips/mountain_king.xmc cargo host-test
      - name: Build
        run: cargo build --release
      - name: Clippy
        run: cargo clippy --release -- -D warnings
      - name: Make the images
        run: |
          mkdir -p images
          ELF=target/riscv32imc-unknown-none-elf/release/onebitdawn
          # The application image, for /update and scripts/ota.sh.
          espflash save-image --chip esp32c3 --partition-table partitions.csv \
            "$ELF" "images/onebitdawn-ota-${GITHUB_REF_NAME}.bin"
          # Everything from offset 0 for `espflash write-bin 0x0`: the
          # bootloader, the partition table, erased otadata (so ota_0
          # boots) and the app. It is contiguous, so it also covers nvs
          # with erased bytes and clears the saved settings.
          espflash save-image --chip esp32c3 --partition-table partitions.csv \
            --merge --skip-padding --flash-size 4mb \
            "$ELF" "images/onebitdawn-${GITHUB_REF_NAME}.bin"
          # The web installer writes four parts and leaves nvs alone, so
          # the settings survive unless the erase is chosen: the bootloader
          # and the partition table cut out of the merged image, an erased
          # otadata, and the application image above.
          dd if="images/onebitdawn-${GITHUB_REF_NAME}.bin" of=images/bootloader.bin bs=4096 count=8 status=none
          dd if="images/onebitdawn-${GITHUB_REF_NAME}.bin" of=images/partition-table.bin bs=4096 skip=8 count=1 status=none
          head -c 8192 /dev/zero | tr '\0' '\377' > images/otadata.bin
          # The default clip pack, for the `clips` partition: the Clips
          # page, scripts/clips.sh or `espflash write-bin 0x2e0000`. The
          # firmware has no clips built in, so the web installer writes
          # it too. Checked by the parser the clock reads it with.
          cargo pack -o "images/onebitdawn-clips-${GITHUB_REF_NAME}.bin" \
            clips/trantor.bpr clips/halftime.xmc clips/keygen.xmc \
            clips/synchronization.pt3c clips/morning_mood.xmc \
            clips/morning_mood_chip.xmc clips/mountain_king.xmc
          CLIP_PACK_FILE="images/onebitdawn-clips-${GITHUB_REF_NAME}.bin" \
            cargo host-test the_pack_file_parses -- --nocapture
          # The pack maker for its page, docs/pack/.
          cargo pack-wasm
          cp target/wasm32-unknown-unknown/tool/onebitdawn_pack.wasm images/
          ls -l images
      - uses: actions/upload-artifact@v6
        with:
          name: images
          path: images/
          if-no-files-found: error

  # The pack maker as a command, for those with no Rust: one file a
  # system, named after it.
  tools:
    name: Pack maker (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: linux-x86_64, exe: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64, exe: ".exe" }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-arm64, exe: "" }
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        shell: bash
        run: |
          cargo build --profile tool -p onebitdawn-pack --bin onebitdawn-pack --target ${{ matrix.target }}
          mkdir -p tools-out
          cp "target/${{ matrix.target }}/tool/onebitdawn-pack${{ matrix.exe }}" \
            "tools-out/onebitdawn-pack-${GITHUB_REF_NAME}-${{ matrix.name }}${{ matrix.exe }}"
          "tools-out/onebitdawn-pack-${GITHUB_REF_NAME}-${{ matrix.name }}${{ matrix.exe }}" \
            -o tools-out/check.bin clips/trantor.bpr mods/Orion-Nero6.3.0.2.xm:name=keygen
          rm tools-out/check.bin
      - uses: actions/upload-artifact@v6
        with:
          name: pack-${{ matrix.name }}
          path: tools-out/
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [build, tools]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: images
          path: images
      - uses: actions/download-artifact@v6
        with:
          pattern: pack-*
          path: tools-out
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            images/onebitdawn-*.bin
            tools-out/onebitdawn-pack-*
          body: |
            Flash a clock from the browser at https://anarsoul.github.io/onebitdawn/
            (Chrome or Edge, the clock on USB), or with espflash, which also
            clears the saved settings, since the file covers the whole flash:

                espflash write-bin 0x0 onebitdawn-${{ github.ref_name }}.bin
                espflash reset

            Update a running clock from `http://<ip>/system` with
            `onebitdawn-ota-${{ github.ref_name }}.bin`, or with
            `API_TOKEN=… scripts/ota.sh <ip> onebitdawn-ota-${{ github.ref_name }}.bin`
            and the clock's API token, if it has one.

            The sampled alarm sounds are a clip pack in a partition of
            their own, `onebitdawn-clips-${{ github.ref_name }}.bin`:
            the web installer writes it; after espflash, upload it from
            `http://<ip>/clips` or write it with

                espflash write-bin 0x2e0000 onebitdawn-clips-${{ github.ref_name }}.bin
                espflash reset

            A pack of your own tunes (tracker modules, Commodore 64
            and ZX Spectrum tunes, sound files) is made in the browser
            at https://anarsoul.github.io/onebitdawn/pack/ or with
            `onebitdawn-pack-${{ github.ref_name }}-*`, the same as a
            command; `--help` says how.

            A clock flashed before this release has no such partition
            until it is flashed again over USB or from the web installer:
            updated over the air it has the note melodies only.

            The images carry no network (the clock boots as its own access
            point, `clock-xxxx`, password `onebitdawn`, setup form at
            http://192.168.4.1/), Vancouver time without daylight saving (`<-07>7`) and no API
            token: updates and uploads go from the clock's pages with the
            PIN its panel shows, and the scripts work once a token is set
            on `http://<ip>/system`; see "Prebuilt images" in MANUAL.md.
            What changed is in CHANGELOG.md.

  pages:
    name: Flasher page
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: images
          path: images
      - name: Stage the release for the page
        run: |
          TAG="$GITHUB_REF_NAME"
          # Five parts at their offsets; nvs (0x9000) is not among them.
          # The last is the default clip pack at the `clips` partition
          # (0x2E0000), which replaces a pack the clock had.
          manifest() {
            jq -n --arg version "${TAG#v}" --arg app "$1" --arg clips "$2" '{
              name: "onebitdawn",
              version: $version,
              new_install_prompt_erase: true,
              new_install_improv_wait_time: 0,
              builds: [{chipFamily: "ESP32-C3", parts: [
                {path: "bootloader.bin", offset: 0},
                {path: "partition-table.bin", offset: 32768},
                {path: "otadata.bin", offset: 65536},
                {path: $app, offset: 131072},
                {path: $clips, offset: 3014656}
              ]}]
            }'
          }
          # The release under its tag, as the page's list offers it.
          mkdir -p "docs/$TAG"
          cp images/bootloader.bin images/partition-table.bin images/otadata.bin "images/onebitdawn-ota-$TAG.bin" "images/onebitdawn-clips-$TAG.bin" "docs/$TAG/"
          manifest "onebitdawn-ota-$TAG.bin" "onebitdawn-clips-$TAG.bin" > "docs/$TAG/manifest.json"
          # The same under fixed names as the fallback when the page
          # cannot ask GitHub for the list; keep_files below leaves earlier
          # tags in place, and these names are overwritten each release.
          mkdir -p docs/latest
          cp images/bootloader.bin images/partition-table.bin images/otadata.bin docs/latest/
          cp "images/onebitdawn-ota-$TAG.bin" docs/latest/onebitdawn-ota.bin
          cp "images/onebitdawn-clips-$TAG.bin" docs/latest/onebitdawn-clips.bin
          manifest "onebitdawn-ota.bin" "onebitdawn-clips.bin" > docs/latest/manifest.json
          cat "docs/$TAG/manifest.json"
          # The pack maker's page, with the converters of this release.
          cp images/onebitdawn_pack.wasm docs/pack/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
