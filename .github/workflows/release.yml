# A release from a `v*` tag: the firmware with the prebuilt settings
# (the same as ci.yml), the OTA image for `/update` and the merged image
# for the web flasher, attached to the GitHub release; then the flasher
# page in docs/ with the release's manifest and images deployed to the
# gh-pages branch, keeping earlier releases, which the page offers in a
# list. The firmware version comes from `git describe`, which sees
# annotated tags only, so a release tag is made with `git tag -a`.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # What the prebuilt image is configured with; see ci.yml and the README.
  WIFI_SSID: ""
  WIFI_PASSWORD: ""
  TZ_OFFSET_MINUTES: "-420"
  API_TOKEN: esp32clock
  ESPFLASH_VERSION: v4.7.0

jobs:
  build:
    name: Firmware and images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # build.rs puts `git describe` into the firmware version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imc-unknown-none-elf
          components: rust-src, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install espflash
        run: |
          curl -sSfL -o espflash.zip \
            "https://github.com/esp-rs/espflash/releases/download/${ESPFLASH_VERSION}/espflash-x86_64-unknown-linux-gnu.zip"
          mkdir -p "$HOME/.local/bin"
          unzip -q espflash.zip espflash -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/espflash"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/espflash" --version
      # A tag never publishes a build the CI would have failed.
      - name: Test the core crate on the host
        run: cargo host-test
      - name: Build
        run: cargo build --release
      - name: Clippy
        run: cargo clippy --release -- -D warnings
      - name: Make the images
        run: |
          mkdir -p images
          ELF=target/riscv32imc-unknown-none-elf/release/esp32clock
          # The application image, for /update and scripts/ota.sh.
          espflash save-image --chip esp32c3 --partition-table partitions.csv \
            "$ELF" "images/esp32clock-ota-${GITHUB_REF_NAME}.bin"
          # Everything from offset 0 for `espflash write-bin 0x0`: the
          # bootloader, the partition table, erased otadata (so ota_0
          # boots) and the app. It is contiguous, so it also covers nvs
          # with erased bytes and clears the saved settings.
          espflash save-image --chip esp32c3 --partition-table partitions.csv \
            --merge --skip-padding --flash-size 4mb \
            "$ELF" "images/esp32clock-${GITHUB_REF_NAME}.bin"
          # The web installer writes four parts and leaves nvs alone, so
          # the settings survive unless the erase is chosen: the bootloader
          # and the partition table cut out of the merged image, an erased
          # otadata, and the application image above.
          dd if="images/esp32clock-${GITHUB_REF_NAME}.bin" of=images/bootloader.bin bs=4096 count=8 status=none
          dd if="images/esp32clock-${GITHUB_REF_NAME}.bin" of=images/partition-table.bin bs=4096 skip=8 count=1 status=none
          head -c 8192 /dev/zero | tr '\0' '\377' > images/otadata.bin
          ls -l images
      - uses: actions/upload-artifact@v6
        with:
          name: images
          path: images/
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: images
          path: images
      - uses: softprops/action-gh-release@v3
        with:
          files: images/esp32clock-*.bin
          body: |
            Flash a clock from the browser at https://anarsoul.github.io/esp32clock/
            (Chrome or Edge, the clock on USB), or with espflash, which also
            clears the saved settings, since the file covers the whole flash:

                espflash write-bin 0x0 esp32clock-${{ github.ref_name }}.bin
                espflash reset

            Update a running clock from `http://<ip>/update` with
            `esp32clock-ota-${{ github.ref_name }}.bin`, or with
            `API_TOKEN=… scripts/ota.sh <ip> esp32clock-ota-${{ github.ref_name }}.bin`.

            The images carry no network (the clock boots as its own access
            point, `clock-xxxx`, password `esp32clock`, setup form at
            http://192.168.4.1/), the Vancouver timezone and the API token
            `esp32clock`; see the README's "Prebuilt images".

  pages:
    name: Flasher page
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: images
          path: images
      - name: Stage the release for the page
        run: |
          TAG="$GITHUB_REF_NAME"
          # Four parts at their offsets; nvs (0x9000) is not among them.
          manifest() {
            jq -n --arg version "${TAG#v}" --arg app "$1" '{
              name: "esp32clock",
              version: $version,
              new_install_prompt_erase: true,
              new_install_improv_wait_time: 0,
              builds: [{chipFamily: "ESP32-C3", parts: [
                {path: "bootloader.bin", offset: 0},
                {path: "partition-table.bin", offset: 32768},
                {path: "otadata.bin", offset: 65536},
                {path: $app, offset: 131072}
              ]}]
            }'
          }
          # The release under its tag, as the page's list offers it.
          mkdir -p "docs/$TAG"
          cp images/bootloader.bin images/partition-table.bin images/otadata.bin "images/esp32clock-ota-$TAG.bin" "docs/$TAG/"
          manifest "esp32clock-ota-$TAG.bin" > "docs/$TAG/manifest.json"
          # The same under fixed names as the fallback when the page
          # cannot ask GitHub for the list; keep_files below leaves earlier
          # tags in place, and these names are overwritten each release.
          mkdir -p docs/latest
          cp images/bootloader.bin images/partition-table.bin images/otadata.bin docs/latest/
          cp "images/esp32clock-ota-$TAG.bin" docs/latest/esp32clock-ota.bin
          manifest "esp32clock-ota.bin" > docs/latest/manifest.json
          cat "docs/$TAG/manifest.json"
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
