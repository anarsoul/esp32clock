# Build, lint and test on every push and pull request, the pack maker
# (tools/pack) and its WebAssembly included, and publish the
# OTA image and the default clip pack as workflow artifacts. The image is built with no network
# (the clock boots as an access point), Vancouver time and no API
# token (updates go by the panel's PIN until one is set); "Prebuilt
# images" in MANUAL.md says how to use it.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # What the prebuilt image is configured with (core/src/config.rs reads
  # these at build time). WIFI_SSID empty: the clock starts as an access
  # point and the network is entered from the setup form.
  WIFI_SSID: ""
  WIFI_PASSWORD: ""
  TZ_RULE: "<-07>7" # Vancouver, UTC-7 all year
  API_TOKEN: "" # none: the PIN on the panel until the owner sets one
  ESPFLASH_VERSION: v4.7.0

jobs:
  host:
    name: Host tests and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test the core crate on the host
        run: cargo host-test
      # The pack maker: its converters against the clips in clips/ and
      # tests/data, which the converters before it made.
      - name: Test the pack maker
        run: cargo pack-test
      # The default clip pack, made by the pack maker and read back by
      # the parser the clock reads it with.
      - name: Make the default clip pack and check it
        run: |
          scripts/clips.sh
          CLIP_PACK_FILE=packs/clips-default.bin cargo host-test the_pack_file_parses -- --nocapture
      # The older way, the clips built into the firmware: the players'
      # tests over the repository's clips run only with clips built in.
      - name: Test with the clips built in
        run: ALARM_CLIP=clips/trantor.bpr,clips/halftime.xmc,clips/keygen.xmc,clips/synchronization.pt3c,clips/morning_mood.xmc,clips/morning_mood_chip.xmc,clips/mountain_king.xmc,clips/suspended_seconds.xmc cargo host-test
      - uses: actions/upload-artifact@v6
        with:
          name: onebitdawn-clips-${{ github.sha }}
          path: packs/clips-default.bin
          if-no-files-found: error
      - name: Clippy on the core crate and its tests
        run: cargo clippy -p onebitdawn-core --target host-tuple --tests -- -D warnings
      - name: Clippy on the pack maker, and its WebAssembly built
        run: |
          cargo clippy -p onebitdawn-pack --target host-tuple --all-targets -- -D warnings
          cargo clippy --profile tool -p onebitdawn-pack --lib --target wasm32-unknown-unknown -- -D warnings
          cargo pack-wasm
          ls -l target/wasm32-unknown-unknown/tool/onebitdawn_pack.wasm

  # The pack maker as the release builds it, on the systems the release
  # builds it for: a link that fails on one of them is found here and
  # not at a tag.
  tools:
    name: Pack maker (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: linux-x86_64, exe: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64, exe: ".exe" }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-arm64, exe: "" }
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build and make a pack
        shell: bash
        run: |
          cargo build --profile tool -p onebitdawn-pack --bin onebitdawn-pack --target ${{ matrix.target }}
          "target/${{ matrix.target }}/tool/onebitdawn-pack${{ matrix.exe }}" \
            -o check.bin clips/trantor.bpr mods/Orion-Nero6.3.0.2.xm:name=keygen

  firmware:
    name: Firmware and OTA image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # build.rs puts `git describe` into the firmware version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imc-unknown-none-elf
          components: rust-src, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install espflash
        run: |
          curl -sSfL -o espflash.zip \
            "https://github.com/esp-rs/espflash/releases/download/${ESPFLASH_VERSION}/espflash-x86_64-unknown-linux-gnu.zip"
          mkdir -p "$HOME/.local/bin"
          unzip -q espflash.zip espflash -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/espflash"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/espflash" --version
      - name: Build
        run: cargo build --release
      - name: Clippy
        run: cargo clippy --release -- -D warnings
      - name: Make the OTA image
        run: |
          espflash save-image --chip esp32c3 --partition-table partitions.csv \
            target/riscv32imc-unknown-none-elf/release/onebitdawn onebitdawn-ota.bin
          ls -l onebitdawn-ota.bin
      - uses: actions/upload-artifact@v6
        with:
          name: onebitdawn-ota-${{ github.sha }}
          path: onebitdawn-ota.bin
          if-no-files-found: error
